name: PEP visual capture

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/data/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pep-visual-capture.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/data/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pep-visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-pep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Project Pages artifact
        run: npm run build

      - name: Prepare Project Pages base path
        run: |
          mkdir -p serve-root/quem-sao-eles
          cp -R dist/. serve-root/quem-sao-eles/

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Serve built artifact
        run: |
          python3 -m http.server 4173 --directory serve-root > /tmp/quem-sao-eles-http.log 2>&1 &
          echo $! > /tmp/quem-sao-eles-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/quem-sao-eles/pep/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quem-sao-eles-http.log
          exit 1

      - name: Capture semantic browser state
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PEP_URL: http://127.0.0.1:4173/quem-sao-eles/pep/
        run: |
          mkdir -p artifacts
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=20000 \
            --dump-dom \
            "$PEP_URL" > artifacts/pep-dom.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1280,900 \
            --virtual-time-budget=20000 \
            --screenshot=artifacts/pep-1280x900.png \
            "$PEP_URL"

          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('artifacts/pep-dom.html', 'utf8');

          const hasSearch = html.includes('id="pep-query"');
          const hasSource = html.includes('Portal da Transparência / CGU');
          const hasCompetence = /<time[^>]+datetime="\d{4}-\d{2}"/.test(html);
          const hasParquet = /href="[^"]*\/data\/\d{6}_pep\.parquet"/.test(html);
          const loading = html.includes('Carregando engine de busca (DuckDB-WASM)...');
          const runtimeError = html.includes('Erro ao inicializar o banco de dados:');

          let state = 'incomplete';
          if (runtimeError) state = 'runtime-error';
          else if (hasSearch && !loading) state = 'search-ready';
          else if (hasSearch && loading) state = 'engine-loading';

          const evidence = {
            state,
            url: process.env.PEP_URL,
            source_visible: hasSource,
            competence_machine_readable: hasCompetence,
            exact_parquet_link_visible: hasParquet,
            search_control_rendered: hasSearch,
          };
          fs.writeFileSync('artifacts/capture-state.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(evidence);

          if (!hasSearch || !hasSource || !hasCompetence || !hasParquet) {
            console.error('Rendered PEP contract is incomplete.');
            process.exit(1);
          }
          if (state === 'incomplete') {
            console.error('Browser state could not be classified.');
            process.exit(1);
          }
          NODE

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pep-rendered-evidence
          path: artifacts/
          if-no-files-found: error
