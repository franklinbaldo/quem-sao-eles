name: Update PEP Data

on:
  schedule:
    - cron: '0 5 1 * *' # Run on the 1st of every month at 05:00 UTC
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Republicar no Pages mesmo sem snapshot novo'
        type: boolean
        default: false

permissions:
  contents: write
  # Para disparar o deploy do Pages: um push feito com o GITHUB_TOKEN
  # não dispara workflow nenhum por conta própria.
  actions: write

jobs:
  pep-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run Pipeline
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run python scripts/pep_pipeline.py

      - name: Commit newly generated parquet (if any changes)
        # Sempre: o Parquet é escrito antes do upload, então uma falha no
        # arquivamento não pode custar o snapshot do mês.
        id: commit
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update PEP Parquet data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # O push acima é feito com o GITHUB_TOKEN, e o GitHub não dispara workflow
      # a partir de push autenticado assim — é a proteção contra recursão. Sem
      # este passo o snapshot novo chega em main e a rota /pep publicada continua
      # servindo a competência anterior, porque pep.astro escolhe o Parquet em
      # tempo de build (#17).
      - name: Publicar o snapshot novo no Pages
        if: steps.commit.outputs.changed == 'true' || inputs.force_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "changed=${{ steps.commit.outputs.changed }} sha=${{ steps.commit.outputs.sha }}"
          gh workflow run deploy.yml --ref main
          gh workflow run pep-visual-capture.yml --ref main
