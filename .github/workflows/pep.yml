name: Update PEP Data

on:
  schedule:
    - cron: '0 5 1 * *' # Run on the 1st of every month at 05:00 UTC
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Republicar no Pages mesmo sem snapshot novo'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Para disparar o deploy do Pages: um push feito com o GITHUB_TOKEN
  # não dispara workflow nenhum por conta própria.
  actions: write

jobs:
  pep-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run Pipeline
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run python scripts/pep_pipeline.py

      # O snapshot vai por PR, não por push direto: a branch default exige que
      # o head esteja atualizado antes do merge, e essa regra também vale para
      # push. O PR entra em auto-merge e cai sozinho quando o check passa.
      - name: Abrir PR com o snapshot novo
        id: snapshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH=automation/pep-snapshot
          git checkout -B "$BRANCH"
          git commit -m "Update PEP Parquet data"
          git push -f origin "$BRANCH"

          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            CORPO="Snapshot mensal do PEP, gerado pelo workflow Update PEP Data."
            URL=$(gh pr create --base main --head "$BRANCH" \
                    --title "Update PEP Parquet data" --body "$CORPO")
            NUM="${URL##*/}"
          fi
          gh pr merge "$NUM" --auto --squash

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr=$NUM" >> "$GITHUB_OUTPUT"

      # O merge do auto-merge é feito com o GITHUB_TOKEN e, como qualquer push
      # dele, não dispara workflow — então o deploy continua precisando de um
      # disparo explícito, agora depois que o PR entra (#17).
      - name: Publicar o snapshot novo no Pages
        if: steps.snapshot.outputs.changed == 'true' || inputs.force_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.snapshot.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            for _ in $(seq 1 40); do
              ESTADO=$(gh pr view "$PR" --json state --jq .state)
              [ "$ESTADO" = MERGED ] && break
              sleep 15
            done
            if [ "$ESTADO" != MERGED ]; then
              echo "::warning::PR #$PR não mergeou em 10 min; o Pages não foi republicado."
              exit 0
            fi
          fi
          gh workflow run deploy.yml --ref main
          gh workflow run pep-visual-capture.yml --ref main
